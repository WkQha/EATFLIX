<body>

        </div>

        <div id="image-preview"></div>
    </div>

    <script>
        function showImagePreview(event) {
            var element = event.target;
            var imageSource = element.getAttribute('src');
            var imagePreview = document.getElementById('image-preview');
            imageSource = imageSource.replace(imageSource[6], Number(imageSource[6]) + 1);
            console.log(imageSource);
            imagePreview.innerHTML = '<img src="' + imageSource + '">';
            imagePreview.style.display = 'block';
        }

        function hideImagePreview() {
            var imagePreview = document.getElementById('image-preview');
            imagePreview.style.display = 'none';
        }

        function showPageContent() {
            document.getElementById('video-background').style.display = "none"
            document.getElementById("page-content").style.display = "block";
        }
    </script>
</body>
